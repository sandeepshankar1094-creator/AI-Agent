[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-agent"
version = "0.1.0"
description = "Generate and validate GitHub Actions and Helm deployment files with Azure OpenAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=0.2,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "streamlit>=1.40,<2",
    "yamllint>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
deployment-agent = "deployment_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
